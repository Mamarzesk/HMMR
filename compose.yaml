# compose.yaml

services:
  runner:
    build: 
      context: .
      target: runner
      tags: 
        - "hmmr:latest"
    stdin_open: false
    tty: false
    volumes:
      - type: bind
        source: $HOME/data/preprocessed/HMMR
        target: /data
        bind:
          selinux: Z

  dev:
    build: 
      context: .
      target: dev
      tags: 
        - "hmmr:dev"
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: $HOME/data/preprocessed/HMMR
        target: /data
        bind:
          selinux: Z
      - type: bind
        source: .
        target: /code
        bind:
          selinux: Z
